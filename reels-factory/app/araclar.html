<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Araçlar</title>
<style>
  :root { --bg:#0b0f1a; --card:#141b2d; --line:#253049; --ink:#eef2fb; --muted:#9aa6c2; --acc:#ffd23f; --ok:#4fd1c5; --bad:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 16px 16px 40px; }
  h1 { font-size: 22px; margin: 4px 0 2px; } .sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  a { color: var(--ok); }
  .top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .card h2 { font-size: 16px; margin: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tag { font: 600 11px system-ui; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .tag.ok { color: #06231f; background: var(--ok); border-color: var(--ok); }
  .tag.run { color: #111; background: var(--acc); border-color: var(--acc); }
  .tag.bad { color: #fff; background: var(--bad); border-color: var(--bad); }
  .ne { font-size: 13.5px; } .kullan, .err, .busy { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
  .err { color: var(--bad); } .busy { color: var(--acc); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
  button { cursor: pointer; border: 0; border-radius: 10px; padding: 8px 14px; font: 700 13px system-ui; background: var(--acc); color: #111; }
  button.ghost { background: #0e1424; color: var(--ink); border: 1px solid var(--line); font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  pre { display: none; margin: 0; max-height: 220px; overflow: auto; background: #0a0e18; border: 1px solid var(--line); border-radius: 10px; padding: 8px; font: 11.5px/1.4 ui-monospace, Consolas, monospace; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
  pre.on { display: block; }
  #msg { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <div class="top"><a href="/">← Fabrika</a></div>
  <h1>🧰 Araçlar</h1>
  <div class="sub">Açık kaynak video otomasyon projeleri. Her biri <code>araclar/</code> klasörüne indirilir ve kendi ortamına kurulur; yalnızca bu bilgisayarda (127.0.0.1) çalışır. Anahtar isteyen araçların API çağrıları ücretlidir — anahtarı aracın kendi sayfasına girersin.</div>
  <div class="top"><button id="all">Hepsini indir ve kur</button><span id="msg"></span></div>
  <div class="cards" id="cards"></div>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const post = async (op, name) => (await fetch("/api/araclar/" + op, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name }) })).json();
const openLogs = new Set();
let rows = [];

function say(t) { $("msg").textContent = t || ""; }

async function act(op, name, btn) {
  btn.disabled = true;
  say(op === "baslat" ? "Başlatılıyor…" : "");
  try {
    const r = await post(op, name);
    say(r.message || "");
    if (op === "baslat" && r.ok && r.url) window.open(r.url, "_blank", "noopener");
  } catch (e) { say("Hata: " + e.message); }
  refresh();
}

function card(r) {
  const c = el("div", "card");
  const h = el("h2", "", r.ad);
  h.append(el("span", "tag", r.lisans));
  if (r.running) h.append(el("span", "tag run", "çalışıyor"));
  else if (r.installed) h.append(el("span", "tag ok", "kurulu"));
  else if (r.downloaded) h.append(el("span", "tag", "indirildi"));
  if (r.error && !r.busy) h.append(el("span", "tag bad", "hata"));
  c.append(h, el("div", "ne", r.ne));
  if (r.busy) c.append(el("div", "busy", "⏳ " + r.busy));
  if (r.missing.length) c.append(el("div", "err", "Eksik program: " + r.missing.join(", ")));
  if (r.error && !r.busy) c.append(el("div", "err", r.error));
  if (r.installed) c.append(el("div", "kullan", r.kullan));
  const row = el("div", "row");
  const kur = el("button", r.installed ? "ghost" : "", r.installed ? "Yeniden kur" : "İndir ve kur");
  kur.disabled = !!r.busy || r.missing.length > 0;
  kur.onclick = () => act("kur", r.name, kur);
  row.append(kur);
  if (r.runnable && r.installed) {
    if (r.running) {
      const ac = el("button", "", "Aç"); ac.onclick = () => window.open(r.url, "_blank", "noopener");
      const dur = el("button", "ghost", "Durdur"); dur.onclick = () => act("durdur", r.name, dur);
      row.append(ac, dur);
    } else {
      const b = el("button", "", "Başlat"); b.onclick = () => act("baslat", r.name, b); row.append(b);
    }
  }
  const lg = el("button", "ghost", "Günlük");
  const pre = el("pre", openLogs.has(r.name) ? "on" : "");
  pre.dataset.name = r.name;
  lg.onclick = () => { openLogs.has(r.name) ? openLogs.delete(r.name) : openLogs.add(r.name); pre.classList.toggle("on"); logs(); };
  const src = el("a", "", "kaynak"); src.href = r.repo; src.target = "_blank"; src.rel = "noopener"; src.style.alignSelf = "center"; src.style.fontSize = "12.5px";
  row.append(lg, src);
  c.append(row, pre);
  return c;
}

async function logs() {
  for (const pre of document.querySelectorAll("pre.on")) {
    const r = await (await fetch("/api/araclar/log/" + encodeURIComponent(pre.dataset.name))).json();
    pre.textContent = r.log || "(henüz günlük yok)";
    pre.scrollTop = pre.scrollHeight;
  }
}

async function refresh() {
  try { rows = await (await fetch("/api/araclar")).json(); } catch (e) { return; }
  $("cards").replaceChildren(...rows.map(card));
  $("all").disabled = rows.every((r) => r.installed || r.busy || r.missing.length);
  logs();
}

$("all").onclick = async () => {
  $("all").disabled = true;
  for (const r of rows) if (!r.installed && !r.busy && !r.missing.length) await post("kur", r.name);
  say("Kurulumlar başladı; kartlardan izleyebilirsin.");
  refresh();
};
refresh();
setInterval(refresh, 4000);
</script>
</body>
</html>
