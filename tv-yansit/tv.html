<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV Yansıt</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: default; }
  canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: none; }
  img { position: fixed; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; -webkit-user-drag: none; user-select: none; }
  #b { position: fixed; left: 0; right: 0; bottom: 8%; color: #fff; font: 28px sans-serif; text-align: center; text-shadow: 0 0 6px #000; }
  #i { position: fixed; left: 12px; top: 10px; color: #fff; font: 15px sans-serif; opacity: .55; text-shadow: 0 0 4px #000; }
  #k { position: fixed; right: 12px; top: 10px; color: #8f8; font: 16px sans-serif; opacity: .8; text-align: right; }
  #s { position: fixed; left: 12px; bottom: 12px; color: #fff; font: 18px sans-serif; opacity: .8; text-shadow: 0 0 4px #000; }
  #kilit { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(15,17,21,.92);
           color: #fff; border: 3px solid #4f8cff; border-radius: 18px; padding: 26px 40px; font: 34px sans-serif;
           text-align: center; display: none; }
</style>
</head>
<body>
<img id="g" alt="">
<canvas id="c"></canvas>
<div id="b">Bağlanıyor…</div>
<div id="k"></div>
<div id="i"></div>
<div id="s"></div>
<div id="kilit">Sesi açmak için kumandada <b>TAMAM</b>'a basın</div>
<script>
/* Eski TV tarayıcıları için ES5: var, function, XMLHttpRequest. */
var AKIS = '__AKIS__', KARE = '__KARE__', SES = '__SES__', GIRDI = '__GIRDI__', KUMANDA = __KUMANDA__, SANAL_KOL = __SANALKOL__;
var g = document.getElementById('g'), b = document.getElementById('b'), k = document.getElementById('k');
var tamEkranIstendi = false;

var bilgi = document.getElementById('i');
function koptu(sonra) {
  b.style.display = 'block';
  b.textContent = 'Bağlantı koptu, yeniden deneniyor…';
  setTimeout(sonra, 1000);
}

/* --- Görüntü: en düşük gecikme için istek-yanıt. TV bir kare ister, bilgisayar en yenisini gönderir; kare
   gelir gelmez bir sonraki istenir, bu sırada gelen kare çizilir. Arada kare birikmez (gecikme büyümez). */
var URLc = window.URL || window.webkitURL, kareW = 16, kareH = 9;
var istekModu = !!(URLc && window.Blob && ('responseType' in new XMLHttpRequest()));
if (istekModu) {
  /* Kareler önce arka planda TAMAMEN çözülür, sonra ekranın yenilenme anında (vsync, requestAnimationFrame)
     tek seferde tuvale çizilir: yarım kare / boş kare görünmez (titreme, yırtılma, dalgalanma olmaz), kareler
     ekranın kendi ritmine oturur (sarsıntı olmaz). */
  var n = 0, sayac = 0, gecikmeler = [], sonGelen = 0, cozumde = 0, hazir = null, cizilenNo = 0;
  var istemci = Math.floor(Math.random() * 1e9).toString(36);   /* bu TV'nin kimliği: aynı kare iki kez gelmesin */
  var tuval = document.getElementById('c'), c2 = tuval.getContext('2d');
  g.style.display = 'none'; tuval.style.display = 'block';
  function boyutla() {
    var o = Math.min(window.devicePixelRatio || 1, 2);
    tuval.width = Math.round(window.innerWidth * o); tuval.height = Math.round(window.innerHeight * o);
    c2.fillStyle = '#000'; c2.fillRect(0, 0, tuval.width, tuval.height);
    if ('imageSmoothingQuality' in c2) c2.imageSmoothingQuality = 'high';
    cizilenNo = 0;
  }
  boyutla();
  window.addEventListener('resize', boyutla, false);
  function kareHazir(k) {                            /* daha yenisi hazırsa eskisini bırak */
    if (hazir && hazir.no > k.no && hazir.no - k.no < 1000) { birak(k); return; }   /* sayaç sıfırlandıysa kabul */
    if (hazir) birak(hazir);
    hazir = k;
  }
  function birak(k) { if (k.resim && k.resim.close) k.resim.close(); if (k.url) URLc.revokeObjectURL(k.url); }
  var ciz = function (k) {                           /* çöz (arka planda) */
    cozumde++;
    if (window.createImageBitmap) {
      createImageBitmap(k.blob).then(function (bmp) { cozumde--; k.resim = bmp; kareHazir(k); },
                                     function () { cozumde--; });
    } else {
      var im = new Image();
      k.url = URLc.createObjectURL(k.blob);
      im.onload = function () { cozumde--; k.resim = im; kareHazir(k); };
      im.onerror = function () { cozumde--; URLc.revokeObjectURL(k.url); };
      im.src = k.url;
    }
  };
  var rAF = window.requestAnimationFrame || window.webkitRequestAnimationFrame || function (f) { return setTimeout(f, 16); };
  function cizimDongusu() {
    if (hazir && hazir.no !== cizilenNo) {
      var k = hazir, r = k.resim, rw = r.width, rh = r.height;
      var s = Math.min(tuval.width / rw, tuval.height / rh), w = Math.round(rw * s), h = Math.round(rh * s);
      var x = (tuval.width - w) >> 1, y = (tuval.height - h) >> 1;
      if (rw !== kareW || rh !== kareH) { c2.fillStyle = '#000'; c2.fillRect(0, 0, tuval.width, tuval.height); }
      c2.drawImage(r, x, y, w, h);
      kareW = rw; kareH = rh; cizilenNo = k.no; sayac++; gecikmeler.push(k.ms);
      b.style.display = 'none';
    }
    rAF(cizimDongusu);
  }
  rAF(cizimDongusu);
  var kareIste = function () {
    var x = new XMLHttpRequest(), t0 = +new Date();
    x.open('GET', KARE + '?n=' + n + '&c=' + istemci, true);
    x.responseType = 'blob';
    x.timeout = 10000;
    x.onload = function () {
      var no = +x.getResponseHeader('X-Kare');
      if (x.status === 200) {
        n = Math.max(n, no || n + 1);
        kareIste();                                   /* önce yeni isteği yolla, sonra çiz */
        if (no && no <= sonGelen && sonGelen - no < 1000) return;   /* daha yenisi zaten geldi */
        sonGelen = no;
        var ag = Math.max(0, (+new Date()) - t0 - (+x.getResponseHeader('X-Bekleme') || 0));
        ciz({ blob: x.response, no: no, ms: (+x.getResponseHeader('X-Yas') || 0) + ag });
      } else if (x.status === 204) {
        if (no < n) n = 0;
        kareIste();
      } else { koptu(kareIste); }
    };
    x.onerror = x.ontimeout = function () { koptu(kareIste); };
    x.send();
  };
  kareIste();
  kareIste();                                     /* iki istek beklesin: kare hazır olur olmaz gider */
  setInterval(function () {
    var o = 0;
    for (var j = 0; j < gecikmeler.length; j++) o += gecikmeler[j];
    bilgi.textContent = sayac + ' fps' + (gecikmeler.length ? ' · ~' + Math.round(o / gecikmeler.length) + ' ms' : '');
    olcum.fps = sayac; olcum.ms = gecikmeler.length ? Math.round(o / gecikmeler.length) : 0;
    sayac = 0; gecikmeler = [];
  }, 1000);
} else {
  /* çok eski tarayıcı: sürekli akış (MJPEG) */
  g.onload = function () { b.style.display = 'none'; };
  g.onerror = function () { koptu(function () { g.src = AKIS + '?t=' + (+new Date()); }); };
  g.src = AKIS;
}
/* --- Ses: bilgisayarın sesi küçük parçalar hâlinde gelir, Web Audio ile ~60 ms tamponla çalınır. Tampon
   büyürse (gecikme) ya da boşalırsa (takılma) kendini sıfırlar; böylece ses görüntünün gerisinde kalmaz. */
var sesBilgi = document.getElementById('s');
var AC = window.AudioContext || window.webkitAudioContext, ctx = null, sesNo = 0, sonraki = 0, sesBasladi = false;
var HEDEF = 0.04, EN_COK = 0.15, sonKesinti = 0;   /* ses tamponu: takılırsa kendiliğinden büyür, düzelince küçülür */
function sesCal(ab, oran) {
  if (!ab.byteLength) return;
  sesBayt += ab.byteLength;
  if (!ctx || ctx.state === 'suspended') return;
  var f = new Float32Array(ab), n = f.length >> 1;
  if (!n) return;
  var buf = ctx.createBuffer(2, n, oran), L = buf.getChannelData(0), R = buf.getChannelData(1);
  for (var i = 0, j = 0; i < n; i++, j += 2) { L[i] = f[j]; R[i] = f[j + 1]; }
  var src = ctx.createBufferSource();
  src.buffer = buf;
  src.connect(ctx.destination);
  var simdi = ctx.currentTime;
  if (sonraki < simdi + 0.005) {                   /* tampon boşaldı: Wi-Fi dalgalı, biraz büyüt */
    if (sonraki) { HEDEF = Math.min(HEDEF + 0.02, 0.12); sonKesinti = +new Date(); }
    sonraki = simdi + HEDEF;
  } else if (sonraki > simdi + Math.max(EN_COK, HEDEF * 2)) {
    sonraki = simdi + HEDEF;                        /* gecikme birikti: atla, gerçek zamana dön */
  } else if (HEDEF > 0.03 && (+new Date()) - sonKesinti > 10000) {
    HEDEF -= 0.01; sonKesinti = +new Date();        /* 10 sn sorunsuz: tamponu küçült */
  }
  (src.start || src.noteOn).call(src, sonraki);
  sonraki += n / oran;
}
function sesIste() {
  var x = new XMLHttpRequest();
  x.open('GET', SES + '?n=' + sesNo, true);
  x.responseType = 'arraybuffer';
  x.timeout = 5000;
  x.onload = function () {
    if (x.status === 200) {
      sesYok = '';
      sesNo = +x.getResponseHeader('X-Ses-No') || sesNo;
      sesCal(x.response, +x.getResponseHeader('X-Oran') || 48000);
      sesIste();
    } else if (x.status === 204) {
      try { sesYok = decodeURIComponent(x.getResponseHeader('X-Ses-Hata') || '') || 'panelde ayrıntı var'; }
      catch (h) { sesYok = 'panelde ayrıntı var'; }
      sesDurum();
      setTimeout(sesIste, 5000);
    } else { setTimeout(sesIste, 1000); }
  };
  x.onerror = x.ontimeout = function () { setTimeout(sesIste, 1000); };
  x.send();
}
var kilit = document.getElementById('kilit'), sesBayt = 0, sesYok = '';
function sesHali() {
  if (!AC) return 'desteklenmiyor';
  if (sesYok) return 'bilgisayarda yok';
  if (!ctx || ctx.state === 'suspended') return 'kilitli';
  return sesBayt ? 'çalıyor' : 'bekleniyor';
}
function sesDurum() {
  var h = sesHali();
  kilit.style.display = h === 'kilitli' ? 'block' : 'none';
  sesBilgi.textContent = h === 'desteklenmiyor' ? 'Bu TV tarayıcısı sesi çalamıyor' :
    h === 'bilgisayarda yok' ? 'Bilgisayar sesi alınamıyor: ' + sesYok : '';
}
setInterval(sesDurum, 1000);
/* TV'nin durumu bilgisayardaki panelde görünsün (fps, gecikme, ses) */
var olcum = { fps: 0, ms: 0 };
setInterval(function () {
  var x = new XMLHttpRequest();
  x.open('POST', SES.replace(/ses$/, 'tvdurum'), true);
  x.setRequestHeader('Content-Type', 'application/json');
  x.send(JSON.stringify({ fps: olcum.fps, ms: olcum.ms, ses: sesHali(), sesKB: Math.round(sesBayt / 1024),
    tampon: Math.round(HEDEF * 1000), ekran: window.innerWidth + 'x' + window.innerHeight }));
}, 2000);
function sesBaslat() {
  if (!AC) return sesDurum();
  if (!ctx) {
    try { ctx = new AC({ latencyHint: 'interactive' }); } catch (x) { ctx = new AC(); }
    if (ctx.onstatechange !== undefined) ctx.onstatechange = sesDurum;
  }
  if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
  if (!sesBasladi) { sesBasladi = true; sesIste(); }
  sesDurum();
}
sesBaslat();                       /* çoğu TV hemen izin verir; vermezse ilk tuş/tıklamada açılır */
setTimeout(sesDurum, 1500);
document.addEventListener('keydown', sesBaslat, true);
document.addEventListener('mousedown', sesBaslat, true);
document.addEventListener('touchstart', sesBaslat, true);
document.addEventListener('click', sesBaslat, true);
document.addEventListener('keyup', sesBaslat, true);

function tamEkran() {
  if (tamEkranIstendi) return false;
  tamEkranIstendi = true;
  var e = document.documentElement, f = e.requestFullscreen || e.webkitRequestFullscreen;
  if (f) { try { f.call(e); } catch (x) {} }
  return true;
}

if (!KUMANDA) {
  document.body.onclick = tamEkran;
} else {
  /* TV kumandası iki modda: FARE (oklar imleci yürütür, Tamam = tıkla, Yeşil = sağ tık) ya da OK TUŞU
     (oklar ve Tamam bilgisayara tuş olarak gider). Değiştirmek: Kırmızı tuş ya da Tamam'a uzun basmak.
     Gerçek fare ya da klavye kullanılınca kendiliğinden ok tuşu moduna geçer. */
  var fareModu = true, modSecildi = false, durumHatasi = '';
  function kumandaYaz() {
    k.textContent = durumHatasi || ('Kumanda: ' + (fareModu ? 'FARE modu (oklar imleç, Tamam tıkla)' : 'OK TUŞU modu') +
      ' · Kırmızı / Tamam\'a uzun bas: değiştir');
  }
  function modDegistir() { fareModu = !fareModu; modSecildi = true; kumandaYaz(); }
  kumandaYaz();

  /* --- gönderim kuyruğu: olaylar toplu gider, aynı anda tek istek */
  var kuyruk = [], yolda = false, sonFare = null;
  function ekle(o) { kuyruk.push(o); if (!yolda) setTimeout(gonder, 0); }
  function gonder() {
    if (sonFare) { kuyruk.push(sonFare); sonFare = null; }
    if (yolda || !kuyruk.length) return;
    var paket = kuyruk.splice(0, 300);
    yolda = true;
    var x = new XMLHttpRequest();
    x.open('POST', GIRDI, true);
    x.setRequestHeader('Content-Type', 'application/json');
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      yolda = false;
      durumHatasi = x.status === 200 ? '' : 'Kumanda kapalı (bilgisayardaki panelden açın)';
      kumandaYaz();
      if (kuyruk.length || sonFare) setTimeout(gonder, 0);
    };
    x.send(JSON.stringify(paket));
  }
  setInterval(gonder, 16);

  /* --- fare: görüntünün gerçek alanına göre 0..1 konum */
  function konum(e) {
    var nw = (istekModu ? kareW : g.naturalWidth) || 16, nh = (istekModu ? kareH : g.naturalHeight) || 9;
    var cw = window.innerWidth, ch = window.innerHeight, s = Math.min(cw / nw, ch / nh);
    var w = nw * s, h = nh * s, ox = (cw - w) / 2, oy = (ch - h) / 2;
    return { t: 'ma', x: Math.max(0, Math.min(1, (e.clientX - ox) / w)), y: Math.max(0, Math.min(1, (e.clientY - oy) / h)) };
  }
  var sonXY = null;
  document.addEventListener('mousemove', function (e) {
    var xy = e.clientX + ',' + e.clientY;
    if (sonXY !== null && xy !== sonXY && fareModu && !modSecildi) { fareModu = false; kumandaYaz(); }  /* gerçek fare var */
    sonXY = xy;
    sonFare = konum(e);
  }, false);
  var fareBasili = {};
  document.addEventListener('mousedown', function (e) {
    e.preventDefault();
    if (tamEkran()) return;                 /* ilk tık yalnızca tam ekran yapar */
    fareBasili[e.button] = true;
    sonFare = null; ekle(konum(e)); ekle({ t: 'md', b: e.button });
  }, false);
  document.addEventListener('mouseup', function (e) {
    e.preventDefault();
    if (!fareBasili[e.button]) return;
    delete fareBasili[e.button];
    ekle(konum(e)); ekle({ t: 'mu', b: e.button });
  }, false);
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); }, false);
  function tekerlek(e) {
    e.preventDefault();
    var d = e.deltaY !== undefined ? e.deltaY : -(e.wheelDelta || 0);
    if (d) ekle({ t: 'mw', d: d > 0 ? -120 : 120 });
  }
  document.addEventListener('wheel', tekerlek, { passive: false });
  document.addEventListener('mousewheel', tekerlek, false);
  /* dokunmatik ekranlı TV/tablet: dokunma = tıklama */
  var dokunma = false;
  document.addEventListener('touchstart', function (e) {
    var t = e.touches[0]; e.preventDefault();
    if (tamEkran()) return;
    dokunma = true; ekle(konum(t)); ekle({ t: 'md', b: 0 });
  }, { passive: false });
  document.addEventListener('touchmove', function (e) { e.preventDefault(); sonFare = konum(e.touches[0]); }, { passive: false });
  document.addEventListener('touchend', function () { if (dokunma) { dokunma = false; ekle({ t: 'mu', b: 0 }); } }, false);

  /* --- klavye ve TV kumandası */
  var vkBasili = {}, okHiz = {}, tamamBas = 0;
  var OKLAR = { 37: [-1, 0], 38: [0, -1], 39: [1, 0], 40: [0, 1] };
  var KIRMIZI = 403, YESIL = 404;
  document.addEventListener('keydown', function (e) {
    var kod = e.keyCode || e.which, tus = e.key || '';
    e.preventDefault();
    if (kod === KIRMIZI) { if (!vkBasili[kod]) modDegistir(); vkBasili[kod] = 'mod'; return; }
    if (kod === YESIL) { if (!vkBasili[kod]) { ekle({ t: 'md', b: 2 }); ekle({ t: 'mu', b: 2 }); } vkBasili[kod] = 'mod'; return; }
    if (kod === 13) { if (!tamamBas) tamamBas = +new Date(); return; }       /* bırakınca: kısa = tıkla/Enter, uzun = mod */
    if (fareModu && OKLAR[kod]) {
      okHiz[kod] = okHiz[kod] ? Math.min(okHiz[kod] * 1.3, 60) : 8;       /* basılı tuttukça hızlanır */
      ekle({ t: 'mr', dx: Math.round(OKLAR[kod][0] * okHiz[kod]), dy: Math.round(OKLAR[kod][1] * okHiz[kod]) });
      return;
    }
    if (fareModu && !modSecildi && ((kod >= 65 && kod <= 90) || tus.length === 1)) { fareModu = false; kumandaYaz(); }
    /* Harf, rakam, boşluk: gerçek tuş (oyunlarda W/A/S/D basılı tutulabilir).
       Diğer yazı karakterleri (ş, ğ, ü, noktalama…): karakter olarak, klavye düzeninden bağımsız. */
    var temel = kod === 32 || (kod >= 48 && kod <= 57) || (kod >= 65 && kod <= 90);
    if (!temel && tus.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
      ekle({ t: 'c', c: tus });
    } else if (kod) {
      /* basılı tutulunca gelen tekrarlar da gider (gerçek klavye de böyle yapar; Silme ve ok tuşları tekrarlar) */
      vkBasili[kod] = true;
      ekle({ t: 'kd', k: kod });
    }
  }, false);
  document.addEventListener('keyup', function (e) {
    var kod = e.keyCode || e.which;
    e.preventDefault();
    delete okHiz[kod];
    if (vkBasili[kod] === 'mod') { delete vkBasili[kod]; return; }
    if (kod === 13 && tamamBas) {
      var sure = (+new Date()) - tamamBas;
      tamamBas = 0;
      if (sure >= 700) modDegistir();
      else if (fareModu) { ekle({ t: 'md', b: 0 }); ekle({ t: 'mu', b: 0 }); }
      else { ekle({ t: 'kd', k: 13 }); ekle({ t: 'ku', k: 13 }); }
      return;
    }
    if (vkBasili[kod]) { delete vkBasili[kod]; ekle({ t: 'ku', k: kod }); }
  }, false);
  function hepsiniBirak() { vkBasili = {}; ekle({ t: 'birak' }); }
  window.addEventListener('blur', hepsiniBirak, false);
  window.addEventListener('pagehide', hepsiniBirak, false);

  /* --- oyun kolu */
  var oncekiKol = {}, kolTuslari = {};
  /* Sanal kol yoksa: sol çubuk = fare, sağ çubuk = kaydırma, A = sol tık, X = sağ tık, B = Esc, Y = Enter,
     yön tuşları = ok tuşları, LB/RB = Page Up/Down, Back = Tab, Start = Windows tuşu */
  var KOL_TUS = { 1: 27, 3: 13, 4: 33, 5: 34, 8: 9, 9: 91, 12: 38, 13: 40, 14: 37, 15: 39 };
  var KOL_FARE = { 0: 0, 2: 2 };
  var kaydirmaBirikim = 0;
  function bas(d) { return d && (typeof d === 'object' ? (d.pressed || d.value > 0.5) : d > 0.5); }
  function olu(v) { return Math.abs(v) < 0.15 ? 0 : v; }
  function kolDongu() {
    var liste = navigator.getGamepads ? navigator.getGamepads() : [];
    for (var i = 0; i < liste.length; i++) {
      var p = liste[i];
      if (!p) continue;
      var dug = [], eks = [];
      for (var n = 0; n < p.buttons.length && n < 17; n++) {
        var d = p.buttons[n];
        dug.push(Math.round((typeof d === 'object' ? d.value || (d.pressed ? 1 : 0) : d) * 100) / 100);
      }
      for (var a = 0; a < p.axes.length && a < 4; a++) eks.push(Math.round(olu(p.axes[a]) * 100) / 100);
      if (SANAL_KOL) {
        var imza = dug.join(',') + '|' + eks.join(',');
        if (oncekiKol[i] !== imza) { oncekiKol[i] = imza; ekle({ t: 'pad', i: i, b: dug, a: eks }); }
        continue;
      }
      var onceki = kolTuslari[i] || {};
      for (var m = 0; m < dug.length; m++) {
        var simdi = dug[m] > 0.5;
        if (simdi === !!onceki[m]) continue;
        onceki[m] = simdi;
        if (KOL_FARE[m] !== undefined) ekle({ t: simdi ? 'md' : 'mu', b: KOL_FARE[m] });
        else if (KOL_TUS[m]) ekle({ t: simdi ? 'kd' : 'ku', k: KOL_TUS[m] });
      }
      kolTuslari[i] = onceki;
      var hiz = 22;
      if (eks[0] || eks[1]) ekle({ t: 'mr', dx: Math.round(eks[0] * Math.abs(eks[0]) * hiz), dy: Math.round(eks[1] * Math.abs(eks[1]) * hiz) });
      kaydirmaBirikim += (eks[3] || 0);
      if (Math.abs(kaydirmaBirikim) >= 4) { ekle({ t: 'mw', d: kaydirmaBirikim > 0 ? -120 : 120 }); kaydirmaBirikim = 0; }
    }
    (window.requestAnimationFrame || function (f) { setTimeout(f, 16); })(kolDongu);
  }
  if (navigator.getGamepads) {
    kolDongu();
    window.addEventListener('gamepadconnected', function (e) {
      k.textContent = 'Oyun kolu bağlandı: ' + (e.gamepad && e.gamepad.id ? e.gamepad.id.slice(0, 40) : '');
    }, false);
  }
}
</script>
