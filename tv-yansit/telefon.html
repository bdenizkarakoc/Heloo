<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f1115">
<title>TV Yansıt — Telefon</title>
<style>
  :root { --bg:#0f1115; --kart:#181b22; --yazi:#e8eaf0; --soluk:#9aa0ad; --vurgu:#4f8cff; --iyi:#3ecf8e; --kotu:#ff6b6b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--yazi); font: 16px/1.4 system-ui, sans-serif;
               overscroll-behavior: none; }
  main { max-width: 560px; margin: 0 auto; padding: 12px 16px 24px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h1 { font-size: 20px; margin: 4px 0; }
  #durum { font-size: 13px; color: var(--soluk); }
  #durum.iyi { color: var(--iyi); } #durum.kotu { color: var(--kotu); }
  #yuzey { margin: 10px 0; height: 42vh; min-height: 220px; border-radius: 16px; background: var(--kart);
           border: 1px solid #262b36; touch-action: none; display: flex; align-items: center; justify-content: center;
           color: #4a5160; text-align: center; padding: 16px; user-select: none; -webkit-user-select: none; }
  #yuzey.surukle { border-color: var(--vurgu); }
  .satir { display: flex; gap: 8px; margin: 8px 0; }
  .satir > * { flex: 1; }
  button { background: #232836; color: var(--yazi); border: 0; border-radius: 12px; padding: 14px 6px; font-size: 16px;
           min-height: 48px; }
  button.ana { background: var(--vurgu); color: #fff; }
  button.acik { background: var(--vurgu); color: #fff; }
  button:active { filter: brightness(1.3); }
  #yaz { width: 100%; background: var(--kart); color: var(--yazi); border: 1px solid #333a48; border-radius: 12px;
         padding: 14px; font-size: 18px; }
  .ipucu { color: var(--soluk); font-size: 13px; margin: 4px 0 0; }
  a { color: var(--vurgu); }
</style>
</head>
<body>
<main>
  <header>
    <h1>TV Yansıt · Telefon</h1>
    <span id="durum">Bağlanıyor…</span>
  </header>

  <div id="yuzey">Dokunmatik yüzey: parmağınızı kaydırın = fare · dokunun = tıkla · iki parmak dokunun = sağ tık · iki parmakla kaydırın = kaydır</div>

  <div class="satir">
    <button id="solTik">Sol tık</button>
    <button id="surukle">Basılı tut</button>
    <button id="sagTik">Sağ tık</button>
  </div>

  <form id="yazForm" autocomplete="off">
    <input id="yaz" type="text" placeholder="Buraya yazın: bilgisayarda yazılır" autocapitalize="off"
           autocorrect="off" spellcheck="false" enterkeyhint="send">
  </form>
  <p class="ipucu">Yazdığınız her harf anında bilgisayarda yazılır. Klavyedeki "Gönder" Enter'a basar.</p>

  <div class="satir">
    <button data-tus="13" class="ana">Enter</button>
    <button data-tus="8">Sil</button>
    <button data-tus="27">Esc</button>
    <button data-tus="9">Tab</button>
  </div>
  <div class="satir">
    <span></span><button data-tus="38">▲</button><span></span>
  </div>
  <div class="satir">
    <button data-tus="37">◀</button><button data-tus="40">▼</button><button data-tus="39">▶</button>
  </div>
  <div class="satir">
    <button data-tus="174">Ses −</button>
    <button data-tus="173">Sessiz</button>
    <button data-tus="175">Ses +</button>
    <button data-tus="179">⏯</button>
  </div>
  <div class="satir">
    <button data-tus="91">Başlat</button>
    <button data-kombin="18,9">Alt+Tab</button>
    <button data-kombin="91,68">Masaüstü</button>
  </div>
  <p class="ipucu"><a id="izle" href="__TV__">Ekranı bu telefonda izle</a></p>
</main>
<script>
/* ES5: eski telefon tarayıcıları da çalışsın */
var GIRDI = '__GIRDI__';
var durum = document.getElementById('durum');

/* --- gönderim kuyruğu: olaylar toplu gider, aynı anda tek istek */
var kuyruk = [], yolda = false, birikenX = 0, birikenY = 0;
function ekle(o) { kuyruk.push(o); gonder(); }
function gonder() {
  if (birikenX || birikenY) { kuyruk.push({ t: 'mr', dx: Math.round(birikenX), dy: Math.round(birikenY) }); birikenX = birikenY = 0; }
  if (yolda || !kuyruk.length) return;
  var paket = kuyruk.splice(0, 300);
  yolda = true;
  var x = new XMLHttpRequest();
  x.open('POST', GIRDI, true);
  x.setRequestHeader('Content-Type', 'application/json');
  x.onreadystatechange = function () {
    if (x.readyState !== 4) return;
    yolda = false;
    if (x.status === 200) { durum.textContent = 'Bağlı'; durum.className = 'iyi'; }
    else if (x.status === 403) { durum.textContent = 'Kumanda kapalı (bilgisayardaki panelden açın)'; durum.className = 'kotu'; }
    else { durum.textContent = 'Bağlantı yok'; durum.className = 'kotu'; }
    if (kuyruk.length || birikenX || birikenY) gonder();
  };
  x.send(JSON.stringify(paket));
}
setInterval(gonder, 16);
ekle({ t: 'kd', k: 0 });   /* bağlantıyı dene (geçersiz tuş: bilgisayarda bir şey olmaz) */

function tus(k) { ekle({ t: 'kd', k: k }); ekle({ t: 'ku', k: k }); }
function tikla(b) { ekle({ t: 'md', b: b }); ekle({ t: 'mu', b: b }); }

/* --- dokunmatik yüzey */
var yuzey = document.getElementById('yuzey');
var dokunmalar = {}, baslangic = 0, hareket = 0, enCokParmak = 0, sonY = null, kaydirma = 0;
function parmaklar(e) { return e.touches ? e.touches.length : 0; }
yuzey.addEventListener('touchstart', function (e) {
  e.preventDefault();
  if (parmaklar(e) === 1 && !enCokParmak) { baslangic = +new Date(); hareket = 0; }
  enCokParmak = Math.max(enCokParmak, parmaklar(e));
  for (var i = 0; i < e.changedTouches.length; i++) {
    var t = e.changedTouches[i];
    dokunmalar[t.identifier] = { x: t.clientX, y: t.clientY };
  }
  sonY = null;
}, { passive: false });
yuzey.addEventListener('touchmove', function (e) {
  e.preventDefault();
  if (parmaklar(e) >= 2) {                       /* iki parmak: kaydır */
    var y = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    if (sonY !== null) {
      kaydirma += y - sonY;
      while (Math.abs(kaydirma) >= 25) { ekle({ t: 'mw', d: kaydirma > 0 ? 120 : -120 }); kaydirma += kaydirma > 0 ? -25 : 25; }
    }
    sonY = y;
    hareket += 10;
    return;
  }
  var t = e.touches[0], o = dokunmalar[t.identifier];
  if (!o) return;
  var dx = t.clientX - o.x, dy = t.clientY - o.y;
  var hiz = Math.sqrt(dx * dx + dy * dy), carpan = hiz > 12 ? 3 : hiz > 5 ? 2 : 1.3;   /* hızlı kaydırınca hızlanır */
  birikenX += dx * carpan; birikenY += dy * carpan;
  hareket += Math.abs(dx) + Math.abs(dy);
  o.x = t.clientX; o.y = t.clientY;
}, { passive: false });
yuzey.addEventListener('touchend', function (e) {
  e.preventDefault();
  for (var i = 0; i < e.changedTouches.length; i++) delete dokunmalar[e.changedTouches[i].identifier];
  if (parmaklar(e) > 0) return;
  var sure = (+new Date()) - baslangic;
  if (sure < 300 && hareket < 12) tikla(enCokParmak >= 2 ? 2 : 0);   /* dokunma: tık, iki parmak: sağ tık */
  enCokParmak = 0; sonY = null; kaydirma = 0;
}, { passive: false });

/* --- düğmeler */
var basili = false, surukle = document.getElementById('surukle');
surukle.onclick = function () {
  basili = !basili;
  ekle({ t: basili ? 'md' : 'mu', b: 0 });
  surukle.className = basili ? 'acik' : '';
  yuzey.className = basili ? 'surukle' : '';
  surukle.textContent = basili ? 'Bırak' : 'Basılı tut';
};
document.getElementById('solTik').onclick = function () { tikla(0); };
document.getElementById('sagTik').onclick = function () { tikla(2); };
var dugmeler = document.querySelectorAll('[data-tus]');
for (var i = 0; i < dugmeler.length; i++) {
  dugmeler[i].onclick = (function (k) { return function () { tus(k); }; })(+dugmeler[i].getAttribute('data-tus'));
}
var kombinler = document.querySelectorAll('[data-kombin]');
for (var j = 0; j < kombinler.length; j++) {
  kombinler[j].onclick = (function (liste) {
    return function () {
      for (var a = 0; a < liste.length; a++) ekle({ t: 'kd', k: liste[a] });
      for (var z = liste.length - 1; z >= 0; z--) ekle({ t: 'ku', k: liste[z] });
    };
  })(kombinler[j].getAttribute('data-kombin').split(',').map(Number));
}

/* --- telefon klavyesiyle yazma: kutudaki değişiklik bilgisayara aynen gider (otomatik düzeltme dahil) */
var yaz = document.getElementById('yaz'), onceki = '';
yaz.addEventListener('input', function () {
  var yeni = yaz.value, p = 0;
  while (p < onceki.length && p < yeni.length && onceki.charAt(p) === yeni.charAt(p)) p++;
  for (var s = 0; s < onceki.length - p; s++) tus(8);                 /* silinenler: Geri Sil */
  var eklenen = yeni.slice(p);
  for (var c = 0; c < eklenen.length; c++) {
    var ch = eklenen.charAt(c), kod = ch.charCodeAt(0);
    if (kod >= 0xD800 && kod <= 0xDBFF && c + 1 < eklenen.length) { ch += eklenen.charAt(++c); }   /* emoji vb. */
    if (ch === '\n') tus(13); else ekle({ t: 'c', c: ch });
  }
  onceki = yeni;
  if (yeni.length > 200) { yaz.value = ''; onceki = ''; }
}, false);
yaz.addEventListener('keydown', function (e) {
  if (e.keyCode === 8 && !yaz.value) { e.preventDefault(); tus(8); }    /* kutu boşken de silebilsin */
}, false);
document.getElementById('yazForm').onsubmit = function (e) {
  e.preventDefault();
  tus(13);
  yaz.value = ''; onceki = '';
};
</script>
</body>
</html>
