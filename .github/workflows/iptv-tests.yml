# Heloo TV (iptv/): Linux'ta birim + arayüz + başsız libmpv testleri; Windows'ta GitHub'dan gerçek mpv indirme,
# RTX VSR filtre seçeneklerinin (d3d11vpp scaling-mode / nvidia-true-hdr) varlığı ve aynı testler.
name: iptv-tests
on:
  push:
    paths: ["iptv/**", ".github/workflows/iptv-tests.yml"]
  pull_request:
    paths: ["iptv/**"]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: iptv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: iptv/requirements.txt
      - name: Sistem paketleri (libmpv, ffmpeg, 7z, Qt offscreen)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libmpv2 ffmpeg p7zip-full libegl1 libxkbcommon0 libfontconfig1 libgl1 libdbus-1-3
      - name: Python paketleri
        run: python -m pip install -q -r requirements.txt pytest
      - name: Testler
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: iptv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: iptv/requirements.txt
      - name: Python paketleri
        run: python -m pip install -q -r requirements.txt pytest
      - name: GitHub'dan mpv indir (libmpv-2.dll + mpv.exe, SHA-256, 7zr)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m helootv.tools.fetch_mpv
      - name: RTX VSR / RTX HDR filtre seçenekleri bu mpv'de var mı?
        shell: pwsh
        run: |
          $out = (& .\bin\mpv.com --no-config "--vf=d3d11vpp=help" 2>&1 | Out-String)
          Write-Host $out
          foreach ($k in @("scale", "scaling-mode", "nvidia-true-hdr", "interlaced-only", "deint")) {
            if ($out -notmatch [regex]::Escape($k)) { throw "d3d11vpp seçeneği bulunamadı: $k" }
          }
          & .\bin\mpv.com --version
      - name: 4K dışa aktarma ve yapay zekâ büyütücü bileşenleri (ffmpeg libplacebo + NVENC, FSRCNNX, ArtCNN)
        shell: pwsh
        run: |
          $f = (& .\bin\ffmpeg.exe -hide_banner -h filter=libplacebo 2>&1 | Out-String)
          if ($f -notmatch "custom_shader_path") { throw "ffmpeg libplacebo/custom_shader_path yok" }
          $e = (& .\bin\ffmpeg.exe -hide_banner -encoders 2>&1 | Out-String)
          if ($e -notmatch "hevc_nvenc") { throw "ffmpeg hevc_nvenc yok" }
          # Shader'lar istege bagli (uygulama onlarsiz da oynatir). GitHub surum dosyasi gecici olarak 5xx
          # verirse CI dusmesin: indirilemeyen shader icin yalniz uyari, en az biri inmis olmali.
          $ok = 0
          foreach ($s in @("FSRCNNX_x2_8-0-4-1.glsl", "ArtCNN_C4F16_DS.glsl")) {
            if (Test-Path ".\bin\shaders\$s") { $ok++; Write-Host "$s : $((Get-Item ".\bin\shaders\$s").Length) bayt" }
            else { Write-Host "::warning::shader indirilemedi (GitHub gecici hatasi olabilir): $s" }
          }
          if ($ok -eq 0) { throw "hicbir shader indirilemedi" }
      # -p no:faulthandler: mpv kapanırken LuaJIT'in kendi yakaladığı SEH istisnalarını (0xE24C4A02) yazdırmasın
      - name: Testler (libmpv-2.dll ile başsız oynatma dahil)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q -p no:faulthandler
      - name: Gerçek pencereye mpv gömme (wid) + Direct3D 11 (GPU'suz makinede WARP)
        env:
          HELOOTV_EMBED_TEST: "1"
          QT_QPA_PLATFORM: windows
        run: python -m pytest tests/test_windows_embed.py -q -s -p no:faulthandler
